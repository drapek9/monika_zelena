<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Přihlášení | Admin nemovitostí</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-wrap">
      <div class="admin-card admin-card--narrow">
        <h1 style="margin: 0 0 0.25rem; font-size: 1.25rem">Admin nemovitostí</h1>
        <p style="margin: 0 0 1.25rem; color: var(--admin-muted); font-size: 0.9rem">
          Přihlaste se pro správu databáze.
        </p>

        <div id="login-error" class="admin-alert admin-alert--error" hidden role="alert"></div>

        <form id="login-form" class="admin-form" novalidate>
          <div class="admin-field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="vas@email.cz"
            />
          </div>
          <div class="admin-field">
            <label for="password">Heslo</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              minlength="6"
            />
          </div>
          <button type="submit" class="admin-btn admin-btn--primary" id="login-submit">
            Přihlásit se
          </button>
        </form>
      </div>

      <p class="admin-credit">
        Admin vytvořil
        <a href="https://simondrapal.cz/" target="_blank" rel="noopener noreferrer">Šimon Drápal</a>
      </p>
    </div>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
