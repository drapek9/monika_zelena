<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kontakt - Monika Zelená, realitní makléřka Jihlava a Vysočina." />
    <title>Kontakt | Monika Zelená</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="header-mount"></div>
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Spojme se</p>
          <h1>Kontakt</h1>
          <p class="lead" style="color: rgba(255,255,255,.75); max-width: 52ch">Krátká zpráva stačí - odpovím co nejdříve.</p>
        </div>
      </section>

      <section class="section">
        <div class="container split">
          <div data-reveal>
            <h2 style="margin-top: 0">Monika Zelená</h2>
            <p style="color: var(--c-muted)">Realitní makléřka · Jihlava &amp; Vysočina</p>
            <p>
              <a href="mailto:zelena@hvreality.cz">zelena@hvreality.cz</a><br />
              <a href="tel:+420731984866">+420 731 984 866</a>
            </p>
            <p class="eyebrow" style="margin-top: 2rem">Sociální sítě</p>
            <div class="social-row">
              <a href="https://www.instagram.com/monika.zelena.reality" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg class="social-icon__svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              </a>
              <a href="https://www.facebook.com/943303708871973/" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <svg class="social-icon__svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              </a>
              <a href="https://www.tiktok.com/@zelena.monika" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
                <img src="assets/icons/tiktok.svg" alt="" width="22" height="22" class="social-icon__svg social-icon__tiktok-img" loading="lazy" decoding="async" />
              </a>
            </div>
            <p style="margin-top: 2rem; font-size: 0.9rem; color: var(--c-muted)">
              Spolupráce v exkluzivním zastoupení <a href="https://hvreality.cz/" target="_blank" rel="noopener noreferrer">HV Reality</a>.
            </p>
          </div>
          <div class="lead-panel" data-reveal>
            <h3 style="color: #fff; margin-top: 0">Rychlá zpráva</h3>
            <form id="contact-form" action="#" method="post">
              <label class="visually-hidden" for="cf-name">Jméno</label>
              <input class="lead-input" id="cf-name" name="name" type="text" required placeholder="Jméno" autocomplete="name" />
              <label class="visually-hidden" for="cf-email">E-mail</label>
              <input class="lead-input" id="cf-email" name="email" type="email" required placeholder="E-mail" autocomplete="email" />
              <label class="visually-hidden" for="cf-msg">Zpráva</label>
              <textarea class="lead-input" id="cf-msg" name="message" rows="4" required placeholder="Jak vám mohu pomoci?" style="resize: vertical; min-height: 120px"></textarea>
              <button type="submit" class="btn btn--primary" style="width: 100%">Odeslat</button>
            </form>
            <p id="contact-feedback" class="lead-feedback" style="display: none"></p>
          </div>
        </div>

        <div class="container mt-md" style="margin-top: 3rem" data-reveal>
          <h2 class="text-center">Lokalita</h2>
          <div class="map-embed">
            <iframe
              title="Mapa - Jihlava"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              src="https://www.google.com/maps?q=Jihlava&output=embed"
            ></iframe>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-mount"></div>
    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="assets/js/site.js" defer></script>
    <script>
      document.getElementById("contact-form")?.addEventListener("submit", function (e) {
        e.preventDefault();
        var fb = document.getElementById("contact-feedback");
        if (fb) {
          fb.style.display = "block";
          fb.textContent = "Děkuji za zprávu. V produkční verzi by zpráva odešla na server; nyní jen ukázka.";
        }
      });
    </script>
  </body>
</html>
