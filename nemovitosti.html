<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Aktuální nabídka a prodané nemovitosti - Jihlava, Vysočina." />
    <title>Nemovitosti | Monika Zelená</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="header-mount"></div>
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Nabídka</p>
          <h1>Nemovitosti</h1>
          <p class="lead" style="color: rgba(255,255,255,.75); max-width: 52ch">Aktivní nabídka a prodané nemovitosti.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="toolbar" data-reveal>
            <div class="filters" role="group" aria-label="Zobrazit nabídku">
              <button type="button" class="filter-btn is-active" data-property-view="aktualni">Aktuální nabídka</button>
              <button type="button" class="filter-btn" data-property-view="prodano">Prodáno</button>
            </div>
          </div>
          <div class="card-grid" id="property-grid-page"></div>
          <div class="text-center mt-md" id="property-load-more-wrap" hidden>
            <button type="button" class="btn btn--outline-dark" id="property-load-more-btn">
              Zobrazit další
            </button>
          </div>
        </div>
      </section>

      <section class="section section--white">
        <div class="container text-center" data-reveal>
          <h2>Nenašli jste, co hledáte?</h2>
          <p class="lead" style="margin-inline: auto">Zanechte poptávku - ozvu se, až se objeví vhodná nemovitost.</p>
          <a href="kontakt.html" class="btn btn--outline-dark mt-sm">Kontaktovat</a>
        </div>
      </section>
    </main>
    <div id="footer-mount"></div>
    <script src="assets/js/site.js" defer></script>
  </body>
</html>
